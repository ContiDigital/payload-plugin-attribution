name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Integration tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgres
            image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
          - database: mongodb
            image: mongo:8@sha256:b8806ee8207318a30316eca72257da4c146025a80fdcdb4c597e596af9233ee3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ${{ matrix.database }} with registry retries
        env:
          DATABASE: ${{ matrix.database }}
          DATABASE_IMAGE: ${{ matrix.image }}
        run: bash ./scripts/ci/start-database.sh "$DATABASE" "$DATABASE_IMAGE"
      - name: Integration tests on Postgres
        if: matrix.database == 'postgres'
        run: pnpm exec vitest run src/__tests__/*.int.test.ts
        env:
          ATTRIBUTION_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/attribution_test
      - name: Integration tests on MongoDB
        if: matrix.database == 'mongodb'
        run: pnpm exec vitest run src/__tests__/*.int.test.ts
        env:
          ATTRIBUTION_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/attribution_test?replicaSet=rs0&directConnection=true
      - name: Stop ${{ matrix.database }}
        if: always()
        env:
          DATABASE: ${{ matrix.database }}
        run: docker rm --force "payload-plugin-attribution-${DATABASE}" >/dev/null 2>&1 || true

  release-check:
    name: Release check (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check

  # engines.node allows 22.12.0, but pnpm 11 refuses to run below Node 22.13. Tooling therefore
  # installs and builds on Node 24; the tests and the packed tarball's runtime imports then run on
  # the floor Node through node itself, with no pnpm step after the switch.
  node-floor:
    name: Tests and runtime imports (Node 22.12.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.12.0
      - name: Confirm the floor Node version
        run: test "$(node --version)" = "v22.12.0"
      - name: Unit and SQLite integration tests
        run: node node_modules/vitest/vitest.mjs run
      - name: Pack smoke runtime imports from the Node 24 build
        run: bash ./scripts/pack-smoke.sh
        env:
          PACK_SMOKE_SKIP_BUILD: 'true'

  e2e:
    name: Browser tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
      - name: Retain Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
